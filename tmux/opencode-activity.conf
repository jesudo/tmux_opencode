# Status bar / window tabs
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=colour250"

# Active and normal inactive tab titles use 20 columns; aging and stale tabs use 8.
# Each tab also has a one-character activity glyph and a one-column gap,
# making 22/10-column cells respectively.
set -g window-status-separator ""
# Refresh quickly so OpenCode markers follow pane command changes.
set -g status-interval 2
# One tab row, two title rows, and two AI-generated next-step rows.
set -g status 5
set -g status-format[0] "#[align=left]#{W:#{E:window-status-format},#{E:window-status-current-format}}"
set -g status-format[1] "#[fg=colour245]#(~/.config/opencode/plugins/tmux-activity/tmux-summary.sh '#S' 1)#[default]"
set -g status-format[2] "#[fg=colour245]#(~/.config/opencode/plugins/tmux-activity/tmux-summary.sh '#S' 2)#[default]"
set -g status-format[3] "#[fg=colour109]#(~/.config/opencode/plugins/tmux-activity/tmux-summary.sh '#S' 1 next)#[default]"
set -g status-format[4] "#[fg=colour109]#(~/.config/opencode/plugins/tmux-activity/tmux-summary.sh '#S' 2 next)#[default]"

# # Inactive window tabs
# set -g window-status-format " #[fg=colour245] #I:#W "

# # Active window tab: blue background, bold dark text
# set -g window-status-current-format " #[bg=colour33,fg=black,bold]  #I:#W  "

# A red tab means /stage is awaiting a decision. Each remaining state has its own
# glyph (● idle, ▶ working, ◆ long-running, ◐ aging, × stale); color is a
# secondary cue.
set -g window-status-format "#{?#{P:#{?#{||:#{==:#{@opencode_stage_waiting},1},#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},stage-attention}}},1,}},#[bg=colour196#,fg=colour231#,bold],#{?#{P:#{?#{||:#{==:#{@opencode_attention_display_disabled},1},#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},attention_display_disabled}}},1,}},#[bg=colour214#,fg=colour16#,bold],#[bg=colour238#,fg=colour117]}}#{?#{P:#{?#{||:#{==:#{@opencode_stage_waiting},1},#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},stage-attention}}},1,}},‼#[fg=colour231],#{?#{P:#{?#{||:#{==:#{@opencode_attention_display_disabled},1},#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},attention_display_disabled}}},1,}},!#[fg=colour16],#{?#{P:#{?#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},long-working}},1,}},#[fg=colour208]◆#[fg=colour117],#{?#{P:#{?#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},working}},1,}},#[fg=colour226]▶#[fg=colour117],#{?#{P:#{?#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},aging}},1,}},#[fg=colour243]◐#[fg=colour117],#{?#{P:#{?#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},stale}},1,}},#[fg=colour245]×#[fg=colour117],#{?#{P:#{?#{==:#{pane_current_command},opencode},1,}},#[fg=colour46]●#[fg=colour117], }}}}}}}#{?#{P:#{?#{&&:#{==:#{pane_current_command},opencode},#{||:#{==:#{@opencode_activity},aging},#{==:#{@opencode_activity},stale}}},1,}},#{p8:#{=8:#{window_index}:#{window_name}}},#{p20:#{=20:#{window_index}:#{window_name}}}}#[default] "

# Bright blue active tabs retain the same attention priority.
set -g window-status-current-format "#{?#{P:#{?#{||:#{==:#{@opencode_stage_waiting},1},#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},stage-attention}}},1,}},#[bg=colour196#,fg=colour231#,bold],#{?#{P:#{?#{||:#{==:#{@opencode_attention_display_disabled},1},#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},attention_display_disabled}}},1,}},#[bg=colour214#,fg=colour16#,bold],#[bg=colour33#,fg=black#,bold]}}#{?#{P:#{?#{||:#{==:#{@opencode_stage_waiting},1},#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},stage-attention}}},1,}},‼#[fg=colour231],#{?#{P:#{?#{||:#{==:#{@opencode_attention_display_disabled},1},#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},attention_display_disabled}}},1,}},!#[fg=colour16],#{?#{P:#{?#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},long-working}},1,}},#[fg=colour208]◆#[fg=black],#{?#{P:#{?#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},working}},1,}},#[fg=colour226]▶#[fg=black],#{?#{P:#{?#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},aging}},1,}},#[fg=colour243]◐#[fg=black],#{?#{P:#{?#{&&:#{==:#{pane_current_command},opencode},#{==:#{@opencode_activity},stale}},1,}},#[fg=colour245]×#[fg=black],#{?#{P:#{?#{==:#{pane_current_command},opencode},1,}},#[fg=colour46]●#[fg=black], }}}}}}}#{p20:#{=20:#{window_index}:#{window_name}}}#[default] "
